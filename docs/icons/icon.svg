<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1E1E2E"/>
  <!-- ripple: ring centres at λ and 2λ, widths w and 2w (λ ≈ 82, w = λ/3)
       colour: white mixed into the background (OKLab) by e^(-r/λ): 1 → 0.368 → 0.135 -->
  <circle cx="256" cy="256" r="192" fill="#373847"/>  <!-- outer ring: 137–192 -->
  <circle cx="256" cy="256" r="137" fill="#1E1E2E"/>
  <circle cx="256" cy="256" r="96"  fill="#686874"/>  <!-- middle ring: 69–96 -->
  <circle cx="256" cy="256" r="69"  fill="#1E1E2E"/>
  <circle cx="256" cy="256" r="18"  fill="#FFFFFF"/>  <!-- dot -->
</svg>
