  <circle cx="256" cy="256" r="137" fill="#212337"/>
  <circle cx="256" cy="256" r="96"  fill="#5B5C66"/>  <!-- middle ring: 69–96 -->
  <circle cx="256" cy="256" r="69"  fill="#212337"/>
  <circle cx="256" cy="256" r="18"  fill="#EBFAFA"/>  <!-- dot -->
</svg>
