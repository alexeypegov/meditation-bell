<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bells – Meditation Timer</title>

  <!-- PWA / home screen install -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#141414">
  <meta name="color-scheme" content="dark">
  <!-- paints the background before style.css loads, so there's no white flash -->
  <style>
    html {
      background: #141414;
    }
  </style>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">

  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="style.css">
  <!-- bundled from src/main.js by esbuild (`task dev` / `task dist`) -->
  <script src="app.js" defer></script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
