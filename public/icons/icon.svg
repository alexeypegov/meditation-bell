<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- Same geometry as Ui.logo: ring n spans r(n-1)..r(n), r(k) = k^2 + 3k,
       odd n only, stroke #777 with opacity (1 - n/10)^2 -->
  <rect width="100" height="100" fill="#141414"/>
  <g fill="none" stroke="#EEE">
    <circle cx="50" cy="50" r="2" stroke-width="4" stroke-opacity="0.81"/>
    <circle cx="50" cy="50" r="14" stroke-width="8" stroke-opacity="0.49"/>
    <circle cx="50" cy="50" r="34" stroke-width="12" stroke-opacity="0.25"/>
    <circle cx="50" cy="50" r="62" stroke-width="16" stroke-opacity="0.09"/>
    <circle cx="50" cy="50" r="98" stroke-width="20" stroke-opacity="0.01"/>
  </g>
</svg>
